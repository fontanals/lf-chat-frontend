name: lf_chat_frontend_dev
services:
  app:
    container_name: lf_chat_app
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    command: npm run dev
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
