name: lf_chat_frontend_test
services:
  app:
    container_name: lf_chat_app_test
    build:
      context: .
      target: development
    ports:
      - "5174:5174"
    command: npm run dev:test
    env_file:
      - .env.test
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5174 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
