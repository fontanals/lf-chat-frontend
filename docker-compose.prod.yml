name: lf_chat_frontend_prod
services:
  app:
    container_name: lf_chat_app_prod
    build:
      context: .
      target: production
      args:
        - VITE_SERVICE_TYPE=${VITE_SERVICE_TYPE}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_DEMO_ACCOUNT_EMAIL=${VITE_DEMO_ACCOUNT_EMAIL}
        - VITE_DEMO_ACCOUNT_PASSWORD=${VITE_DEMO_ACCOUNT_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lf_chat_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - lf_chat_network

networks:
  lf_chat_network:
    external: true
