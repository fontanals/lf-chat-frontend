server {
    listen 80;
    server_name lfchat.lucasfontana.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lfchat.lucasfontana.dev;

    ssl_certificate /etc/letsencrypt/live/lfchat.lucasfontana.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lfchat.lucasfontana.dev/privkey.pem;

    location /api {
        proxy_pass http://lf_chat_api_prod:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}