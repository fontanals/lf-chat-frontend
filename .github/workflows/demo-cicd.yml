name: Demo CI/CD

on:
  push:
    branches:
      - demo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lf-chat-backend
          ref: demo
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create backend .env.test file
        working-directory: backend
        run: |
          cat << EOF > .env.test
          PORT="3001"
          LOGS_PATH="logs"
          CORS_ORIGINS="http://localhost:5173,http://localhost:5174"
          POSTGRES_HOST="localhost"
          POSTGRES_PORT="5433"
          POSTGRES_USER="postgres"
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          POSTGRES_DB="lf_chat"
          ACCOUNT_VERIFICATION_TOKEN_SECRET="${{ secrets.ACCOUNT_VERIFICATION_TOKEN_SECRET }}"
          ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}"
          REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}"
          PASSWORD_RECOVERY_TOKEN_SECRET="${{ secrets.PASSWORD_RECOVERY_TOKEN_SECRET }}"
          SMTP_HOST="${{ secrets.SMTP_HOST }}"
          SMTP_PORT="${{ secrets.SMTP_PORT }}"
          SMTP_USER="${{ secrets.SMTP_USER }}"
          SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}"
          SUPPORT_EMAIL="${{ secrets.SUPPORT_EMAIL }}"
          AWS_REGION="${{ secrets.AWS_REGION }}"
          AWS_S3_BUCKET_NAME="${{ secrets.AWS_S3_BUCKET_NAME }}"
          AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          OPENAI_MAIN_MODEL="gpt-4o-mini"
          OPENAI_LOW_MODEL="gpt-4o-mini"
          OPENAI_MONTHLY_USAGE_LIMIT_IN_DOLLARS="15"
          ENABLE_RATE_LIMITING="false"
          RATE_LIMIT_WINDOW_IN_MINUTES="15"
          RATE_LIMIT_MAX_REQUESTS="100"
          MAX_DOCUMENTS_PER_USER="25"
          EOF

      - name: Create frontend .env.test file
        working-directory: frontend
        run: |
          cat << EOF > .env.test
          VITE_SERVICE_TYPE="web"
          VITE_API_BASE_URL="http://localhost:3001/api"
          VITE_DEMO_ACCOUNT_EMAIL="demo@lfchat.lucasfontana.dev"
          VITE_DEMO_ACCOUNT_PASSWORD="@lfchatdemo"
          EOF

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend service
        working-directory: backend
        run: |
          docker compose --env-file .env.test -f docker-compose.test.yml up -d --wait

      - name: Start frontend service
        working-directory: frontend
        run: |
          docker compose -f docker-compose.test.yml up -d --wait

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Stop and remove containers
        if: always()
        run: |
          cd backend && docker compose --env-file .env.test -f docker-compose.test.yml down -v
          cd ../frontend && docker compose -f docker-compose.test.yml down -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /home/${{ secrets.EC2_USER }}/lf-chat-frontend

            git fetch origin demo
            git checkout demo
            git pull origin demo

            cat << EOF > .env
            VITE_SERVICE_TYPE="web"
            VITE_API_BASE_URL="https://lfchat.lucasfontana.dev/api"
            VITE_DEMO_ACCOUNT_EMAIL="demo@lfchat.lucasfontana.dev"
            VITE_DEMO_ACCOUNT_PASSWORD="@lfchatdemo"
            EOF

            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d --build --wait

            docker compose -f docker-compose.prod.yml ps

            docker image prune -f
